name: school_inventory_frontend
description: Cross-platform school equipment inventory client for Android and Windows.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  provider: ^6.1.2
  mobile_scanner: ^5.2.3
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  file_selector: ^1.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
