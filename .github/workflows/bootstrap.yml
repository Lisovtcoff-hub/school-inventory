name: Bootstrap project

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ hashFiles('.bootstrap/part-*.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and unpack project
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.txt | base64 --decode > /tmp/project.tar.xz
          test "$(sha256sum /tmp/project.tar.xz | awk '{print $1}')" = "4f28d69e4c6d7eb89823dc13293f7d25291bd03dbb82ebc907c47ad9d17f0de8"
          mkdir /tmp/project
          tar -xJf /tmp/project.tar.xz -C /tmp/project
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.bootstrap/' \
            /tmp/project/ ./
          rm -rf .bootstrap

      - name: Publish clean project tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import school inventory platform"
          git push
