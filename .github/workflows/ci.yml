name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_inventory_test
          POSTGRES_USER: school_inventory
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_inventory -d school_inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+psycopg://school_inventory:test-password@127.0.0.1:5432/school_inventory_test
      SECRET_KEY: ci-secret-key-for-tests-only-at-least-32-characters
      BACKEND_CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Check Python source
        run: |
          python -m compileall -q backend/app backend/tests
          ruff check --select E9,F63,F7,F82 backend/app backend/tests

      - name: Validate PostgreSQL migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform runners
        run: python scripts/bootstrap_flutter.py

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: frontend
        run: flutter test
